name: verify

on:
  push:
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Import SAOR core
        run: python -c "import sys; sys.path.insert(0, '02_Algorithms_and_Software'); import saor_core"
      - name: Run self-test
        run: python -B verify.py --self-test

  complete-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run complete verification
        run: python -B verify.py --verify
